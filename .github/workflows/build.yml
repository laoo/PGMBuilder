name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # libstdc++ linked in: the binary needs only the C library
          - name: linux-x64
            os: ubuntu-latest
            preset: native
            binary: PGMBuilder
            archive: tar.gz
            configure: -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          # Apple silicon
          - name: macos-arm64
            os: macos-latest
            preset: native
            binary: PGMBuilder
            archive: zip
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          # MSVC rather than the runner's MinGW, its runtime linked in: no redistributable needed
          - name: windows-x64
            os: windows-latest
            preset: vs-windows
            binary: PGMBuilder.exe
            archive: zip
            configure: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show CMake Version
        run: cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package
        shell: bash
        run: |
          version="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          version="${version:-$(git rev-parse --short HEAD)}"
          package="PGMBuilder-${version}-${{ matrix.name }}"
          mkdir "$package"
          cp "out/build/${{ matrix.preset }}/${{ matrix.binary }}" README.md LICENSE "$package/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cmake -E tar cf "$package.zip" --format=zip "$package"
          else
            cmake -E tar czf "$package.tar.gz" "$package"
          fi
          echo "PACKAGE=$package.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PGMBuilder-${{ matrix.name }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" packages/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
